services:
  mysql:
    image: mysql:8.4
    container_name: student-management-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-student_management}
      MYSQL_USER: ${MYSQL_USER:-student_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-root-me}
    ports:
      - "3306:3306"
    volumes:
      - student_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-change-root-me}"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  student_mysql_data:
